<!DOCTYPE html>
<html lang ="en">
    
<head>
    <meta charset ="UTF-8">
    <meta name = "viewpoint"  content="width=device-width,inital scale=1.0"> 
    <link rel="stylesheet" href="../style.css">
    <title>Parking Structure 3</title>
</head>

<body>

    <section class="parking-header">
        <h1>Parking Structure 3</h1>
	<table style="width:100%; margin:0 auto;">
            <tr>
                <th>Available Spaces</th>
                <th>Estimated Time To Park</th>
            </tr>
            <tr>
                <td><span id="available_spaces"></span> spaces</td>
                <td><1 min</td>
            </tr>
        </table>
    </section>
  

    <section class="parking-lot">
        <div class="parking-space"></div>
        <div class="parking-space"></div>

        <div class="parking-space"></div>
        <div class="parking-space"></div>

        <div class="parking-space"></div>
        <div class="parking-space"></div>

        <div class="parking-space"></div>
        <div class="parking-space"></div>

        <div class="parking-space"></div>
        <div class="parking-space"></div>

        <div class="parking-space"></div>
        <div class="parking-space"></div>
    </section>

    <button
    class="back-button"
    type="button"
    onclick="window.location.href='../MainApplication.html'"
    >
    
    Back to Campus Map
    </button>

    <script>
        let avail_spaces = 0;
	document.addEventListener("DOMContentLoaded", function () {

             const parkingSpaces = document.querySelectorAll(".parking-space");

            parkingSpaces.forEach(function(space) {
                const statusIcon=document.createElement("span");
                const isAvailable=Math.random() < 0.5;

                if(isAvailable) {
		    avail_spaces += 1;
                    statusIcon.className="space-status available";
                    statusIcon.textContent="✓";
                    statusIcon.setAttribute("data-tooltip", "Available Parking Space");
                    statusIcon.setAttribute("aria-label", "Available Parking Space");

                     statusIcon.addEventListener("click", function() {
                    window.location.href="AvailableSpace.html";
                });
                } else {
                    const carIcon=document.createElement("span");

                    carIcon.className="car-icon";
                    carIcon.textContent="🚗";
                    carIcon.setAttribute("data-tooltip", "Car is parked");

                    space.appendChild(carIcon);

                    statusIcon.className="space-status occupied";
                    statusIcon.textContent="×";
                    statusIcon.setAttribute("data-tooltip", "Occupied Parking Space");
                    statusIcon.setAttribute("aria-label", "Occupied Parking Space");
                }

                space.appendChild(statusIcon);
            });
          document.getElementById("available_spaces").textContent = avail_spaces;

        });
          
        </script>

</body>
</html>
